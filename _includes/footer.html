{% include base_path %}

<div class="page__footer-copyright">
  &copy; {{ site.time | date: '%Y' }} Dingwei Guo<br />
  Site last updated {{ "now" | date: '%Y-%m-%d' }}<br />
  <span id="visitor-count" style="display: none;"></span>
</div>

<script data-goatcounter="https://dw-guo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const today = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/New_York",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    const url =
      "https://dw-guo.goatcounter.com/counter/TOTAL.json" +
      "?start=" + encodeURIComponent(today) +
      "&end=" + encodeURIComponent(today);

    fetch(url)
      .then(function(response) {
        if (!response.ok) {
          throw new Error("GoatCounter request failed");
        }
        return response.json();
      })
      .then(function(data) {
        const el = document.getElementById("visitor-count");

        if (data.count !== undefined) {
          el.textContent = "Visitors today: " + data.count;
          el.style.display = "inline";
        }
      })
      .catch(function(error) {
        console.log("Visitor counter error:", error);
      });

  });
</script>
